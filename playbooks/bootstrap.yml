---
- name: Bootstrap the ansible user on managed hosts
  hosts: all:!bastion
  gather_facts: true
  vars:
    # Log in as each host's existing user for this play only
    ansible_user: "{{ bootstrap_user | default('brian') }}"
    # Root logins don't need sudo (and Proxmox doesn't ship with it)
    ansible_become: "{{ (bootstrap_user | default('brian')) != 'root' }}"
    fleet_pubkey: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') + '/.ssh/id_ed25519_fleet.pub') }}"

  tasks:
    - name: Ensure sudo is installed
      ansible.builtin.apt:
        name: sudo
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the ansible user
      ansible.builtin.user:
        name: ansible
        shell: /bin/bash
        create_home: true

    - name: Authorize the bastion's fleet key for the ansible user
      ansible.posix.authorized_key:
        user: ansible
        key: "{{ fleet_pubkey }}"
        state: present

    - name: Grant the ansible user passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible
        content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
